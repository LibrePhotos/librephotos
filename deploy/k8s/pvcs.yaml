# This volume holds your photos.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photos
spec:
  resources:
    requests:
      storage: 30Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce

---

# This volume (/protected_media) holds the thumbnails, about 10-15% the size of "photos", and next to them the
# machine learning models (several GB once downloaded), the cache of converted videos (TRANSCODE_CACHE_MAX_GB,
# 10 GB by default) and the zip archives of downloads, which are kept for a day. Size it for all of them, including
# the largest download you expect.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: protected
spec:
  resources:
    requests:
      storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce

---

# The postgres volume holds all the metadata. If it's 1% the size of "photos," you're probably fine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
spec:
  resources:
    requests:
      storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
