# Dev compose: builds images from local sources and mounts the monorepo for
# hot-reload. Paths are relative to this file (deploy/compose/).
#
# Run from anywhere with:
#   docker compose -f deploy/compose/docker-compose.yml \
#                  -f deploy/compose/docker-compose.dev.yml up -d
#
# Added tools vs. production compose:
#   pgadmin — user admin@admin / pass admin — port 3001

services:
  proxy:
    tty: true
    build:
      context: ../..
      dockerfile: deploy/docker/proxy/Dockerfile
    container_name: proxy
    volumes:
      - ${scanDirectory}:/data
      - ${data}/protected_media:/protected_media

  frontend:
    tty: true
    environment:
      - DEBUG=1
      - WDS_SOCKET_PORT=0 # needed for Vite HMR behind the proxy
      # Why Did You Render. Vite only forwards VITE_-prefixed variables to
      # client code, so the name has to survive intact all the way through.
      - VITE_APP_WDYR=${VITE_APP_WDYR:-false}
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile.dev
    container_name: frontend
    volumes:
      - ../../apps/frontend:/usr/src/app

  backend:
    tty: true
    stdin_open: true
    environment:
      - DEBUG=1
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        DEBUG: 1
    container_name: backend
    volumes:
      - ${scanDirectory}:/data
      - ${data}/protected_media:/protected_media
      - ${data}/logs:${baseLogs:-/logs}
      - ${data}/cache:/root/.cache
      - ../../apps/backend:/code
      - ../vscode/server-extensions:/root/.vscode-server/extensions
      - ../vscode/server-insiders-extensions:/root/.vscode-server-insiders/extensions
      - ../vscode/settings.json:/code/.vscode/settings.json
      - ../docker/backend/entrypoint.sh:/entrypoint.sh

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - ${pgAdminLocation}/pgadmin:/root/.pgadmin
    ports:
      - "3001:80"
    restart: unless-stopped
