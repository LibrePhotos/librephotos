# The Python versions the backend supports: the one place that says so. The
# floor is the lowest Python an image runs (backend-gpu: CUDA 12.1.1 /
# ubuntu22.04, Python 3.10); the backend and unified images run 3.12, the
# Windows build 3.11. test-backend.yml runs the suite on every image's Python,
# and api/tests/infra/test_python_versions.py keeps the images, the workflows
# and the requirements markers inside this range. Nothing installs the backend
# as a package; `name` and `version` are only here because a [project] table
# needs them.
[project]
name = "librephotos-backend"
version = "0"
requires-python = ">=3.10,<3.15"

[tool.ruff]
# Pin the linter: ruff's findings shift between releases, so an unpinned local
# ruff quietly disagrees with CI. A mismatch fails loudly here instead of
# producing a different set of errors on a contributor's machine. Keep this in
# sync with requirements.dev.txt, .pre-commit-config.yaml and
# .github/workflows/lint-backend.yml - all four must name the same version
# (api/tests/infra/test_ruff_pins.py). A new version reports different
# findings: regenerate ruff-baseline.toml (scripts/ruff_baseline.py --update)
# in the same pull request.
required-version = "==0.15.22"
line-length = 88
# No target-version: ruff takes the floor of requires-python above, so it
# reports syntax Python 3.10 cannot parse and pyupgrade never rewrites code to
# 3.11-only APIs (datetime.UTC).
extend-exclude = ["migrations"]
# Findings that predate a rule, one entry per file, generated by
# scripts/ruff_baseline.py. The file only shrinks: fix code, then `--update`.
# Permanent exceptions go in [tool.ruff.lint.extend-per-file-ignores]: a plain
# per-file-ignores table in this file would replace the baseline's table
# instead of adding to it.
extend = "ruff-baseline.toml"

[tool.ruff.lint]
# Every rule here applies to new code at once; existing findings of the
# baselined rules are listed per file in ruff-baseline.toml.
extend-select = [
  "E",       # pycodestyle errors (E501 ignored below)
  "W",       # pycodestyle warnings
  "I",       # isort
  "UP",      # pyupgrade, for target-version
  "S110",    # try/except/pass: log the exception or catch a narrower one
  "S112",    # try/except/continue: same
  "PLE",     # pylint errors
  "PLC",     # pylint conventions (PLC0415 ignored below)
  "G",       # flake8-logging-format
  "LOG",     # flake8-logging
  "ANN401",  # no explicit `Any` in annotations: use object, a Protocol or a TypedDict
  "TID251",  # banned APIs, see [tool.ruff.lint.flake8-tidy-imports.banned-api]
  # Baselined: old findings are listed in ruff-baseline.toml.
  "N",       # pep8-naming
  "DJ",      # flake8-django (DJ001 on an existing field needs a migration: fix it with a model change)
  "BLE001",  # blind `except Exception` that neither re-raises nor logs the traceback
  "T20",     # print(): use a logger, or self.stdout.write in management commands
  "PLW",     # pylint warnings
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR1711", # useless return
  "PLR1714", # repeated equality comparison: use `in`
  "PLR5501", # collapsible else-if
  # G004 (f-string in a logging call) is on too; the existing sites are
  # converted area by area with that area's log-level review (#170, #2340).
]
# Deliberately off; do not re-add without a plan for the existing sites:
#   PLC0415  import inside a function: the lazy ML/vips/numpy imports are on purpose
#   PLR2004  magic values: hundreds of findings for little value
ignore = [
  "E501",    # line length is ruff format's job
  "PLC0415",
]

[tool.ruff.lint.pep8-naming]
# Custom assertions on a TestCase follow unittest's camelCase (assertEqual).
extend-ignore-names = ["assert*"]

[tool.ruff.lint.flake8-annotations]
# `*args: Any, **kwargs: Any` on pass-through overrides (DRF views, Django
# managers) is the one place where `Any` is the honest type.
allow-star-arg-any = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The environment is read in one place (issue #2337): the Django process reads
# django.conf.settings, and the settings modules, entry points and sidecars read
# through librephotos/env.py, which parses every on/off switch and number the
# same way and names the variable when a value is wrong.
"os.environ".msg = "Read configuration through django.conf.settings; settings and sidecars use librephotos/env.py."
"os.getenv".msg = "Read configuration through django.conf.settings; settings and sidecars use librephotos/env.py."
# External tools run through one module (issue #2338): it resolves the binary
# (the System32 trap on Windows), demands a timeout and logs failures the same way.
"subprocess".msg = "Run external tools through api.runtime.binaries.run_tool (with a timeout) or start_tool."
# Background work is queued in one module (issue #2333): it writes the job's
# LongRunningJob row before the task is queued and refuses a duplicate start.
"django_q.tasks".msg = "Queue work through api.jobs.queue (enqueue_job, enqueue_followup, enqueue_task, schedule_once)."
# Each entry must name the replacement in its message.
"datetime.UTC".msg = "Python 3.10 (backend-gpu image) has no datetime.UTC; use datetime.timezone.utc."

[tool.ruff.lint.extend-per-file-ignores]
# Permanent exceptions only; findings still to be fixed live in ruff-baseline.toml.
# Always extend-per-file-ignores, never per-file-ignores (see `extend` above).
# Ruff ignores by code, so an entry lifts that rule for the whole file.
#
# Tests: not type-checked yet (see [tool.mypy] exclude), and they set up the
# environment the code under test reads.
"**/tests/**" = ["ANN401", "TID251"]
"**/test/**" = ["ANN401"]
"**/tests.py" = ["ANN401", "TID251"]
# Build and maintenance tools, run outside the server: they print to the
# terminal and read the environment directly.
"scripts/**" = ["T20", "TID251"]
# Console entry points that print to the terminal on purpose; standalone.py
# also builds the environment of the child processes it starts.
"librephotos/standalone.py" = ["T20", "TID251"]
# Files that may touch os.environ (issue #2337), subprocess (issue #2338) or
# django_q.tasks (issue #2333) directly; keep this list short. An entry lifts every banned API in the file.
# The parser itself.
"librephotos/env.py" = ["TID251"]
# It builds the environment of the sidecars it starts, and supervises them.
"api/runtime/supervisor.py" = ["TID251"]
# The one runner of external tools.
"api/runtime/binaries.py" = ["TID251"]
# The one module that queues background work (issue #2333).
"api/jobs/queue.py" = ["TID251"]
# They pick DJANGO_SETTINGS_MODULE from DEBUG before any settings exist.
"manage.py" = ["TID251"]
"librephotos/wsgi.py" = ["TID251"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
# Run through scripts/typecheck.py, which compares the result with
# mypy-baseline.txt. See docs/development/contribution/backend.
python_version = "3.14"          # = the Python CI installs packages for: their stubs (numpy) use newer syntax
platform = "linux"               # Windows dev boxes report exactly what CI reports
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["api", "librephotos", "service", "nextcloud", "chunked_upload", "image_similarity", "scripts/typecheck.py",
         "scripts/check_dead_code.py", "scripts/ruff_baseline.py", "scripts/openapi_schema.py",
         "scripts/import_contracts_baseline.py", "scripts/smoke_standalone.py"]
exclude = ['/migrations/', '/tests?/', '/tests\.py$']
check_untyped_defs = true
disallow_untyped_defs = true     # every function must be annotated
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]

[[tool.mypy.overrides]]          # untyped third-party packages and sidecar-local imports
module = ["allauth.*", "bulk_update.*", "constance.*", "cpuinfo.*", "diskcache.*", "django_q.*",
          "exiftool.*", "filetype.*", "geopy.*", "hdbscan.*", "insightface.*", "onnxruntime.*",
          "owncloud.*", "pyclipper.*", "pystray.*", "pyvips.*", "sklearn.*", "tokenizers.*",
          "lfm2_vl", "openclip.*", "ppocr.*", "retrieval_index", "utils", "vulture"]
ignore_missing_imports = true

[[tool.mypy.overrides]]          # strict modules: this list only grows, and each entry names a checked module (scripts/typecheck.py enforces both)
# Explicit flags instead of `strict = true`: inside an override, `strict` turns
# the strict flags on for every module, not just the listed ones.
module = ["api.dataviz.color_palettes", "api.metadata.tags", "api.runtime.http_timeouts",
          "api.drf.pagination", "api.serializers.site_settings", "librephotos.env",
          "typecheck", "ruff_baseline"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_return_any = true
strict_equality = true
no_implicit_reexport = true
extra_checks = true

[tool.django-stubs]
django_settings_module = "librephotos.settings.test_sqlite"

# Import contracts (issue #2335), checked by import-linter: `lint-imports` from
# apps/backend (pinned in requirements.dev.txt, run by lint-backend.yml). It
# reads the code without importing it and follows imports inside functions too.
# Each contract's ignore_imports lists the violations that predate it: the list
# only shrinks (scripts/import_contracts_baseline.py fails CI on a new entry,
# and lint-imports on an entry that no longer matches an import). A move PR
# adds its new package to the domain layer below.
[tool.importlinter]
root_packages = ["api", "nextcloud", "librephotos", "service", "image_similarity"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Views over serializers over domain packages over models"
type = "layers"
layers = [
  "api.views : nextcloud.views",
  "api.serializers",
  "api.accounts : api.albums : api.classification : api.dataviz : api.directory_watcher : api.drf : api.duplicates : api.faces : api.geocode : api.jobs : api.metadata : api.photos : api.runtime : api.search : api.serving : api.stacks : api.thumbnails : api.video",
  "api.models",
]
ignore_imports = [
  # The rule modules give User its JSON field defaults; migrations reference
  # those defaults by path in api.models.user, so they stay there.
  "api.models.user -> api.metadata.datetime_rules",
  "api.models.user -> api.stacks.burst_rules",
  # OPENCLIP and TAG_THING_TYPE, the model's name as stored in captions_json,
  # clip_embeddings_model and thing_type. api.search.semantic defines them and
  # stays importable without the app registry (scripts/calibrate_openclip.py);
  # the model side goes with #2336.
  "api.models.photo_caption -> api.search.semantic",
  "api.models.photo_search -> api.search.semantic",
]

[[tool.importlinter.contracts]]
id = "views-no-sidecars"
name = "Views reach the sidecars only through a domain module"
type = "forbidden"
source_modules = ["api.views"]
forbidden_modules = ["api.runtime.sidecars"]
# Through a domain module is the point; only a direct import breaks it.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "django-free"
name = "Sidecars and the sidecar client never import Django"
type = "forbidden"
# The sidecars read their ports from api.runtime.sidecars, and run without Django.
source_modules = ["service", "image_similarity", "api.runtime.sidecars"]
forbidden_modules = ["django"]

[[tool.importlinter.contracts]]
id = "django-free-package-inits"
name = "Importing api.runtime.sidecars runs only Django-free package inits"
type = "forbidden"
# Python runs api/__init__.py and api/runtime/__init__.py before
# api.runtime.sidecars, and the contract above does not see them: they import
# nothing. As modules, not packages: the rest of api.runtime needs Django.
# The exif service reads api.metadata.tags (SIDECAR_EQUIVALENTS), so the same
# holds for api/metadata/__init__.py.
source_modules = ["api", "api.runtime", "api.metadata"]
forbidden_modules = ["django"]
as_packages = false

[[tool.importlinter.contracts]]
id = "startup-page-django-free"
name = "The start-up page runs before Django and never imports it"
type = "forbidden"
# librephotos.startup_page answers on the server's port while migrate runs
# (#2310): `python -m librephotos.startup_page` in the Docker entrypoint, a
# thread of the Windows app before it sets Django up. librephotos/__init__.py
# runs first, so it stays empty too.
source_modules = ["librephotos", "librephotos.startup_page"]
forbidden_modules = ["django"]
as_packages = false
