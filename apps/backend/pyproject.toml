[tool.ruff]
# Pin the linter: ruff's findings shift between releases, so an unpinned local
# ruff quietly disagrees with CI. A mismatch fails loudly here instead of
# producing a different set of errors on a contributor's machine. Keep this in
# sync with requirements.dev.txt, .pre-commit-config.yaml and
# .github/workflows/lint-backend.yml - all four must name the same version.
required-version = "==0.15.22"
line-length = 88
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# NOTE: the select list below used to live in a top-level `[lint]` table, which
# ruff does not read, so it never applied - only ruff's default rules (E4, E7,
# E9, F) were ever enforced. Enabling it now surfaces ~968 pre-existing findings,
# which is a cleanup of its own; it stays commented out so the intent is not lost
# a second time.
# select = [
#   "E",  # pycodestyle errors
#   "F",  # Pyflakes
#   "W",  # pycodestyle warnings
#   "I",  # isort (import sorting)
#   "N",  # PEP8 naming
#   "UP", # Pyupgrade (modern syntax)
#   "DJ", # flake8-django
#   "PL", # pylint rules
# ]
extend-select = [
  "G",       # flake8-logging-format
  "LOG",     # flake8-logging
  "PLE1205", # too many arguments for the logging format string
  "PLE1206", # too few arguments for the logging format string
  "ANN401",  # no explicit `Any` in annotations: use object, a Protocol or a TypedDict
]
ignore = [
  "E501",
  "E203",
  "E231",
  # f-strings in logging calls (~257 sites). Converting them is done per area
  # together with that area's log-level review, not in one sweeping commit.
  "G004",
]

[tool.ruff.lint.flake8-annotations]
# `*args: Any, **kwargs: Any` on pass-through overrides (DRF views, Django
# managers) is the one place where `Any` is the honest type.
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# Tests are not type-checked yet (see [tool.mypy] exclude).
"**/tests/**" = ["ANN401"]
"**/test/**" = ["ANN401"]
"**/tests.py" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
# Run through scripts/typecheck.py, which compares the result with
# mypy-baseline.txt. See docs/development/contribution/backend.
python_version = "3.14"          # = the Python CI installs packages for: their stubs (numpy) use newer syntax
platform = "linux"               # Windows dev boxes report exactly what CI reports
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["api", "librephotos", "service", "nextcloud", "chunked_upload", "image_similarity", "scripts/typecheck.py"]
exclude = ['/migrations/', '/tests?/', '/tests\.py$']
check_untyped_defs = true
disallow_untyped_defs = true     # every function must be annotated
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]

[[tool.mypy.overrides]]          # untyped third-party packages and sidecar-local imports
module = ["allauth.*", "bulk_update.*", "constance.*", "cpuinfo.*", "diskcache.*", "django_q.*",
          "exiftool.*", "filetype.*", "geopy.*", "hdbscan.*", "insightface.*", "onnxruntime.*",
          "owncloud.*", "pyclipper.*", "pystray.*", "pyvips.*", "sklearn.*", "tokenizers.*",
          "lfm2_vl", "openclip.*", "ppocr.*", "retrieval_index", "utils"]
ignore_missing_imports = true

[[tool.mypy.overrides]]          # strict modules: this list only grows (scripts/typecheck.py enforces it)
# Explicit flags instead of `strict = true`: inside an override, `strict` turns
# the strict flags on for every module, not just the listed ones.
module = ["api.color_palettes", "api.metadata.tags", "api.http_timeouts",
          "api.views.pagination", "api.schemas.site_settings", "typecheck"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_return_any = true
strict_equality = true
no_implicit_reexport = true
extra_checks = true

[tool.django-stubs]
django_settings_module = "librephotos.settings.test_sqlite"
