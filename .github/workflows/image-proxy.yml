name: image-proxy

on:
  release:
    types: [created]
  push:
    branches: [dev]
    paths:
      - 'deploy/docker/proxy/**'
      - '.github/workflows/image-proxy.yml'

jobs:
  dev:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: reallibrephotos/librephotos-proxy:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            reallibrephotos/librephotos-proxy:${{ github.event.release.tag_name }}
            reallibrephotos/librephotos-proxy:latest
