name: mobile

on:
  push:
    branches: [dev]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm workspaces: install once at the repo root against the root
          # package-lock.json (apps/mobile + packages/* are workspaces).
          # better-sqlite3 must stay >= 12 here: 11.x aborts jest workers on
          # Node 24 (Statement destructor after env teardown).
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces)
        run: npm ci
      - name: typecheck
        run: npm run typecheck --workspace apps/mobile
      - name: lint
        run: npm run lint --workspace apps/mobile
      - name: test (jest — rn + node projects)
        run: npm run test --workspace apps/mobile

  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (workspaces)
        run: npm ci
      - name: typecheck
        run: npm run typecheck --workspace packages/api-client
      - name: lint
        run: npm run lint --workspace packages/api-client
      - name: test (vitest)
        run: npm run test --workspace packages/api-client
