name: _build-image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: "Docker Hub image name, e.g. reallibrephotos/librephotos"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile, from repo root"
        required: true
        type: string
      context:
        description: "Build context path (usually '.' for monorepo-root builds)"
        required: false
        default: "."
        type: string
      build-args:
        description: "Newline-separated build args, e.g. 'GIT_HASH=abc123'"
        required: false
        default: ""
        type: string
      release-tag:
        description: "If set, push as <image>:<release-tag> and, unless the release is a pre-release, <image>:latest. Otherwise push as <image>:dev."
        required: false
        default: ""
        type: string
      amd64-only:
        description: "Build only linux/amd64. Use for images whose base has no arm64 manifest (e.g. GPU)."
        required: false
        default: false
        type: boolean
      base-image:
        description: "Base image the Dockerfile builds FROM through ARG BASE_TAG, e.g. reallibrephotos/librephotos-base. On a release build its :dev is promoted to :<release-tag> first and BASE_TAG=<release-tag> is passed, so the release is pinned to that base. Dev builds keep the Dockerfile default (dev)."
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # The base workflows promote the same tag on release (image-backend-base*.yml),
  # but they run in parallel with this one, so promote here too before building.
  # Both copy :dev, so whichever runs first wins and the other is a no-op.
  pin-base:
    if: ${{ inputs.base-image != '' && inputs.release-tag != '' }}
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Promote base :dev to the release tag
        env:
          BASE_IMAGE: ${{ inputs.base-image }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if docker buildx imagetools inspect "${BASE_IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${BASE_IMAGE}:${RELEASE_TAG} already exists, leaving it alone"
          else
            docker buildx imagetools create -t "${BASE_IMAGE}:${RELEASE_TAG}" "${BASE_IMAGE}:dev"
          fi

  build-amd64:
    needs: pin-base
    # pin-base is skipped for dev builds and for images without a base-image.
    if: ${{ !cancelled() && (needs.pin-base.result == 'success' || needs.pin-base.result == 'skipped') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            echo "tag=${{ inputs.image }}:${{ inputs.release-tag }}-amd64" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image }}:dev-amd64" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.base-image }}" ] && [ -n "${{ inputs.release-tag }}" ]; then
            echo "base-arg=BASE_TAG=${{ inputs.release-tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (AMD64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          # Empty lines are skipped, so base-arg may be unset.
          build-args: |
            ${{ inputs.build-args }}
            ${{ steps.tag.outputs.base-arg }}
          tags: ${{ steps.tag.outputs.tag }}

  build-arm64:
    needs: pin-base
    if: ${{ !inputs.amd64-only && !cancelled() && (needs.pin-base.result == 'success' || needs.pin-base.result == 'skipped') }}
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            echo "tag=${{ inputs.image }}:${{ inputs.release-tag }}-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image }}:dev-arm64" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.base-image }}" ] && [ -n "${{ inputs.release-tag }}" ]; then
            echo "base-arg=BASE_TAG=${{ inputs.release-tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (ARM64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          # Empty lines are skipped, so base-arg may be unset.
          build-args: |
            ${{ inputs.build-args }}
            ${{ steps.tag.outputs.base-arg }}
          tags: ${{ steps.tag.outputs.tag }}

  combine-manifest:
    needs: [build-amd64, build-arm64]
    if: |
      always() &&
      needs.build-amd64.result == 'success' &&
      (inputs.amd64-only || needs.build-arm64.result == 'success')
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Combine manifest
        run: |
          if [ "${{ inputs.amd64-only }}" = "true" ]; then
            ARM64_SUFFIX=""
          else
            ARM64_SUFFIX="-arm64"
          fi
          if [ -n "${{ inputs.release-tag }}" ]; then
            BASE="${{ inputs.image }}:${{ inputs.release-tag }}"
            SOURCES="${BASE}-amd64"
            [ -n "$ARM64_SUFFIX" ] && SOURCES="$SOURCES ${BASE}${ARM64_SUFFIX}"
            docker buildx imagetools create -t "${BASE}" $SOURCES
            # A GitHub pre-release (an RC) gets its own tag but must not move
            # :latest, which every compose install pulls by default. A called
            # workflow sees the caller's event, so the flag is available here.
            if [ "${{ github.event.release.prerelease }}" != "true" ]; then
              docker buildx imagetools create -t ${{ inputs.image }}:latest $SOURCES
            fi
          else
            SOURCES="${{ inputs.image }}:dev-amd64"
            [ -n "$ARM64_SUFFIX" ] && SOURCES="$SOURCES ${{ inputs.image }}:dev${ARM64_SUFFIX}"
            docker buildx imagetools create -t ${{ inputs.image }}:dev $SOURCES
          fi
