name: _build-image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: "Docker Hub image name, e.g. reallibrephotos/librephotos"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile, from repo root"
        required: true
        type: string
      context:
        description: "Build context path (usually '.' for monorepo-root builds)"
        required: false
        default: "."
        type: string
      build-args:
        description: "Newline-separated build args, e.g. 'GIT_HASH=abc123'"
        required: false
        default: ""
        type: string
      release-tag:
        description: "If set, push as <image>:<release-tag> and also <image>:latest. Otherwise push as <image>:dev."
        required: false
        default: ""
        type: string
    secrets:
      DOCKER_HUB_USERNAME:
        required: true
      DOCKER_HUB_ACCESS_TOKEN:
        required: true

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            echo "tag=${{ inputs.image }}:${{ inputs.release-tag }}-amd64" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image }}:dev-amd64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (AMD64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.tag.outputs.tag }}

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            echo "tag=${{ inputs.image }}:${{ inputs.release-tag }}-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.image }}:dev-arm64" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.tag.outputs.tag }}

  combine-manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Combine multi-arch manifest
        run: |
          if [ -n "${{ inputs.release-tag }}" ]; then
            docker buildx imagetools create -t ${{ inputs.image }}:${{ inputs.release-tag }} \
              ${{ inputs.image }}:${{ inputs.release-tag }}-amd64 \
              ${{ inputs.image }}:${{ inputs.release-tag }}-arm64
            docker buildx imagetools create -t ${{ inputs.image }}:latest \
              ${{ inputs.image }}:${{ inputs.release-tag }}-amd64 \
              ${{ inputs.image }}:${{ inputs.release-tag }}-arm64
          else
            docker buildx imagetools create -t ${{ inputs.image }}:dev \
              ${{ inputs.image }}:dev-amd64 \
              ${{ inputs.image }}:dev-arm64
          fi
