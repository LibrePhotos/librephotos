name: opencv-wheel

on:
  push:
    paths:
      - apps/backend/scripts/build_opencv_wheel.py
      - apps/backend/scripts/opencv_wheel_parity.py
      - .github/workflows/opencv-wheel.yml
  pull_request:
    paths:
      - apps/backend/scripts/build_opencv_wheel.py
      - apps/backend/scripts/opencv_wheel_parity.py
      - .github/workflows/opencv-wheel.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the manylinux_2_28_${{ matrix.arch }} wheel
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo quay.io/pypa/manylinux_2_28_${{ matrix.arch }} bash -c "
            set -e
            /opt/python/cp314-cp314/bin/python -m venv /tmp/build
            /tmp/build/bin/python apps/backend/scripts/build_opencv_wheel.py /repo/opencv-wheels \
              --work-dir /tmp/opencv --plat manylinux_2_28_${{ matrix.arch }}"
          ls -l opencv-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: opencv-wheel-linux-${{ matrix.arch }}
          path: opencv-wheels/*.whl

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: ilammy/setup-nasm@v1
      - name: Build the win_amd64 wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/Scripts/python.exe" apps/backend/scripts/build_opencv_wheel.py opencv-wheels --work-dir "$RUNNER_TEMP/opencv"
          ls -l opencv-wheels
      - uses: actions/upload-artifact@v7
        with:
          name: opencv-wheel-windows-amd64
          path: opencv-wheels/*.whl

  check:
    needs: [linux, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, artifact: opencv-wheel-linux-x86_64 }
          - { runner: ubuntu-24.04-arm, artifact: opencv-wheel-linux-aarch64 }
          - { runner: windows-latest, artifact: opencv-wheel-windows-amd64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    env:
      BASE_LOGS: ${{ github.workspace }}/scratch/logs
      BASE_DATA: ${{ github.workspace }}/scratch/data
      SECRET_KEY: test-secret-key
      DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
      NO_COVERAGE: "1"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: opencv-wheels
      - name: Install the PyPI wheel and ours in two venvs
        run: |
          mkdir -p "$BASE_LOGS" "$BASE_DATA"
          python -m venv ../../scratch/official
          python -m venv ../../scratch/minimal
          python - <<'PY'
          import os, pathlib, re
          wheel = next(pathlib.Path("../../opencv-wheels").glob("*.whl")).resolve()
          requirements = pathlib.Path("requirements.txt").read_text()
          version = re.search(r"^opencv-python-headless==([^\s;]+)", requirements, re.M)[1]
          pins = {"official": f"opencv-python-headless=={version}", "minimal": f"opencv-lp-headless @ {wheel.as_uri()}"}
          for venv, pin in pins.items():
              out = pathlib.Path(f"../../scratch/{venv}-requirements")
              out.mkdir()
              for path in pathlib.Path(".").glob("requirements*.txt"):
                  text = path.read_text()
                  if path.name == "requirements.txt":
                      text = re.sub(r"^opencv-.*\n", "", text, flags=re.M) + pin + "\n"
                  (out / path.name).write_text(text)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"OFFICIAL_PIN={pins['official']}\n")
          PY
          bin=bin; [ "$RUNNER_OS" = Windows ] && bin=Scripts
          scratch=$(cd ../../scratch && pwd)
          echo "OFFICIAL=$scratch/official/$bin/python" >> "$GITHUB_ENV"
          echo "MINIMAL=$scratch/minimal/$bin/python" >> "$GITHUB_ENV"
          "$scratch/official/$bin/python" -m pip install -q -r ../../scratch/official-requirements/requirements.txt
          "$scratch/minimal/$bin/python" -m pip install -q -r ../../scratch/minimal-requirements/requirements.txt \
            -r requirements.dev.txt
      - name: Nothing pulls the PyPI OpenCV back in
        run: |
          "$MINIMAL" -m pip install --dry-run --quiet --report ../../scratch/report.json \
            -r ../../scratch/minimal-requirements/requirements.txt -r requirements.dev.txt \
            -r requirements.mlval.txt -r requirements.standalone.txt
          "$MINIMAL" - <<'PY'
          import importlib.metadata, json, re, sys
          report = json.loads(open("../../scratch/report.json", encoding="utf-8").read())
          resolved = [i["metadata"]["name"] for i in report["install"]]
          installed = [d.metadata["Name"] for d in importlib.metadata.distributions()]
          names = {re.sub(r"[-_.]+", "-", n).lower() for n in resolved + installed}
          opencv = sorted(n for n in names if "opencv" in n)
          print("opencv distributions:", opencv)
          sys.exit(opencv != ["opencv-lp-headless"])
          PY
          "$MINIMAL" -m pip check
      - name: Sizes
        run: |
          "$OFFICIAL" -m pip download -q --no-deps "$OFFICIAL_PIN" -d ../../scratch/official-wheel
          for python in "$OFFICIAL" "$MINIMAL"; do
            "$python" - <<'PY'
          import importlib.metadata
          for dist in importlib.metadata.distributions():
              if "opencv" in dist.metadata["Name"].lower():
                  files = [f.locate() for f in dist.files if not str(f).endswith(".pyc")]
                  sizes = sorted(((f.stat().st_size, f.name) for f in files if f.exists()), reverse=True)
                  print(f"{dist.metadata['Name']} {dist.version}: installed {sum(s for s, _ in sizes) / 1e6:.1f} MB")
                  for size, name in sizes[:6]:
                      print(f"  {size / 1e6:8.2f} MB  {name}")
          PY
          done
          ls -l ../../scratch/official-wheel ../../opencv-wheels
      - name: Same outputs under both wheels
        run: |
          "$OFFICIAL" scripts/opencv_wheel_parity.py prepare ../../scratch/inputs
          "$OFFICIAL" scripts/opencv_wheel_parity.py models ../../scratch/models
          "$OFFICIAL" scripts/opencv_wheel_parity.py dump ../../scratch/inputs ../../scratch/official.npz --models ../../scratch/models --timing
          "$MINIMAL" scripts/opencv_wheel_parity.py dump ../../scratch/inputs ../../scratch/minimal.npz --models ../../scratch/models --timing
          "$MINIMAL" scripts/opencv_wheel_parity.py compare ../../scratch/official.npz ../../scratch/minimal.npz
      - name: The cv2 tests pass on our wheel
        run: |
          "$MINIMAL" manage.py test api.tests.editing api.tests.ml_services.test_face_analysis \
            api.tests.ml_services.test_face_recognition_sidecar api.tests.ocr --parallel 2
      - name: Nuitka compiles and runs cv2 from our wheel
        if: runner.os == 'Windows'
        run: |
          "$MINIMAL" -m pip install -q -r requirements.standalone.txt
          mkdir -p ../../scratch/nuitka
          cat > ../../scratch/nuitka/cv2_smoke.py <<'PY'
          import cv2
          import numpy as np
          ok, png = cv2.imencode(".png", np.full((8, 8, 3), 7, np.uint8))
          image = cv2.imdecode(png, cv2.IMREAD_UNCHANGED)
          print(cv2.__version__, image.shape, cv2.resize(image, (4, 4), interpolation=cv2.INTER_AREA).sum())
          PY
          cd ../../scratch/nuitka
          "$MINIMAL" -m nuitka --standalone --assume-yes-for-downloads --noinclude-custom-mode=numpy:bytecode cv2_smoke.py
          ./cv2_smoke.dist/cv2_smoke.exe
