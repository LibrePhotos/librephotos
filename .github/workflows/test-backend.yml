name: test-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      # api/tests/infra checks these too (compose keys, images, entrypoints, the
      # environment-variables page, workflow pins); a change there alone must run it.
      - 'deploy/**'
      - 'apps/docs/docs/installation/environment-variables.md'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/backend/**'
      # api/tests/infra checks these too (compose keys, images, entrypoints, the
      # environment-variables page, workflow pins); a change there alone must run it.
      - 'deploy/**'
      - 'apps/docs/docs/installation/environment-variables.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  django:
    name: django (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest: ~5.5 min to install, ~2 min for the suite.
    # 30 leaves room for a slow runner without letting a hang burn an hour.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The Python of every image, on every pull request: 3.12 is the backend
        # and unified images (ubuntu:noble). Pushes to dev add 3.14, the newest Python in requires-python
        # (apps/backend/pyproject.toml). 3.11 (the Windows build) is not here:
        # there is no Linux cp311 insightface wheel; standalone-windows.yml and
        # prebuilt-wheels.yml install on it. api/tests/infra/test_python_versions.py
        # fails when an image's Python is missing from either list.
        python: ${{ github.event_name == 'push' && fromJSON('["3.12", "3.14"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        id: install
        working-directory: apps/backend
        # The virtualenv is required, not tidiness. scripts/setup_test_env.sh
        # falls back to `pip install --user` when VIRTUAL_ENV is unset, which
        # puts the packages under $HOME. api/tests/infra/test_issue_907_matplotlib_config_dir.py spawns
        # a probe subprocess with HOME repointed at a sandbox (that is the whole
        # point of the test: proving the matplotlib cache does not follow it),
        # so a --user install is invisible to the probe and it dies with
        # "ModuleNotFoundError: No module named 'django'".
        run: |
          python -m venv .venv
          . .venv/bin/activate
          bash scripts/setup_test_env.sh

      - name: ffmpeg comes from the wheel, not the runner
        # The wheel's .pth puts ffmpeg on PATH inside Python processes, which is
        # the only place the backend calls it from.
        working-directory: apps/backend
        run: |
          sudo apt-get remove -y ffmpeg >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/ffmpeg /usr/bin/ffprobe
          . .venv/bin/activate
          python - <<'PY'
          import shutil, subprocess
          print("ffmpeg:", shutil.which("ffmpeg"), "ffprobe:", shutil.which("ffprobe"))
          assert "ffmpeg_bin" in (shutil.which("ffmpeg") or ""), "ffmpeg not from the wheel"
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi", "-i", "testsrc=duration=1:size=64x64:rate=5", "-c:v", "libx264", "-y", "/tmp/wheel-smoke.mp4"], check=True)
          out = subprocess.run(["ffprobe", "-hide_banner", "-v", "error", "-show_entries", "stream=codec_name", "-of", "default=nw=1", "/tmp/wheel-smoke.mp4"], check=True, capture_output=True, text=True).stdout
          assert "codec_name=h264" in out, out
          PY

      - name: Django system checks
        # Same env as the test step below. Under the test settings DEBUG is on
        # while silk is not installed, which used to stop the checks from
        # importing at all (the silk guard in librephotos/urls.py fixes that).
        # --fail-level WARNING makes any system check warning fail the job.
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
        run: |
          . .venv/bin/activate
          python manage.py check --fail-level WARNING

      - name: OpenAPI schema is current (openapi.json, openapi-baseline.txt)
        # packages/api-client compares its zod schemas with the committed
        # apps/backend/openapi.json, so a serializer or view change has to
        # regenerate it: `python scripts/openapi_schema.py` from apps/backend.
        # The script pins its own settings module (test_sqlite) and fails on a
        # stale file and on a drf-spectacular report missing from, or fixed
        # but still in, openapi-baseline.txt. Once per run, in the 3.12 job:
        # the schema does not depend on the interpreter. Runs even when the
        # checks above failed, so a stale schema reports with them.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.python == '3.12' }}
        working-directory: apps/backend
        run: |
          . .venv/bin/activate
          python scripts/openapi_schema.py --check

      - name: Run tests
        # manage.py measures coverage while the suite runs unless NO_COVERAGE is
        # set, and saves it to apps/backend/.coverage. Running the suite under
        # `coverage run` as well would only double the tracing. Coverage is
        # measured once, in the 3.12 job, which the gate below reads; the other
        # jobs set NO_COVERAGE (manage.py only checks that it exists).
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          . .venv/bin/activate
          if [ "$PYTHON_VERSION" != "3.12" ]; then export NO_COVERAGE=1; fi
          python manage.py test api.tests nextcloud

      - name: Coverage gate (fail_under in apps/backend/.coveragerc)
        # Reads the data file the test step saved; no tests run here. Exits
        # non-zero when the total is below fail_under. The step is skipped when
        # the tests fail, since there is then no data file to report on, and in
        # every job but 3.12, which alone measures coverage.
        if: ${{ matrix.python == '3.12' }}
        working-directory: apps/backend
        run: |
          . .venv/bin/activate
          coverage report

      - name: Type check (no new errors vs mypy-baseline.txt)
        # Runs even when tests failed, so type errors and test failures report
        # together; skipped only when the install itself failed. Once per run,
        # in the 3.12 job: the result does not depend on the interpreter, since
        # [tool.mypy] pins python_version.
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.python == '3.12' }}
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
        run: |
          . .venv/bin/activate
          BASE=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            BASE="--base-ref origin/$GITHUB_BASE_REF"
          fi
          python scripts/typecheck.py $BASE
