name: test-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'

jobs:
  django:
    runs-on: ubuntu-latest
    # Observed: ~5.5 min to install, ~2 min to run. The headroom is for a cold
    # wheel cache, not for a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The app targets 3.11 (pyproject `target-version`); lint-backend runs
          # a newer interpreter because ruff does not import the code, the tests
          # do.
          python-version: "3.11"
      # setup_test_env.sh installs the system libraries (libvips, exiftool,
      # libmagic, ...) and the Python requirements. Reusing it here keeps CI and
      # the documented local flow from drifting apart.
      #
      # It runs inside a virtualenv rather than against the runner's Python
      # because without VIRTUAL_ENV it falls back to `pip install --user`, which
      # puts the packages under $HOME. api/tests/test_repro_issue_907.py spawns
      # a probe process with HOME pointed at a sandbox, and that process would
      # then be unable to import Django at all.
      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m venv .venv
          . .venv/bin/activate
          bash scripts/setup_test_env.sh
      - name: Run tests
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
        run: |
          . .venv/bin/activate
          python manage.py test api.tests
