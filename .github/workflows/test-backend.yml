name: test-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    # Measured on ubuntu-latest: ~5.5 min to install, ~2 min for the suite.
    # 30 leaves room for a slow runner without letting a hang burn an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # The tests import and execute the code, so this must be a version the
          # dependencies actually support. pyproject sets target-version = "py311"
          # for ruff and python_version = "3.11" for mypy.
          python-version: "3.14"

      - name: Install dependencies
        id: install
        working-directory: apps/backend
        # The virtualenv is required, not tidiness. scripts/setup_test_env.sh
        # falls back to `pip install --user` when VIRTUAL_ENV is unset, which
        # puts the packages under $HOME. api/tests/infra/test_issue_907_matplotlib_config_dir.py spawns
        # a probe subprocess with HOME repointed at a sandbox (that is the whole
        # point of the test: proving the matplotlib cache does not follow it),
        # so a --user install is invisible to the probe and it dies with
        # "ModuleNotFoundError: No module named 'django'".
        run: |
          python -m venv .venv
          . .venv/bin/activate
          bash scripts/setup_test_env.sh

      - name: ffmpeg comes from the wheel, not the runner
        # The wheel's .pth puts ffmpeg on PATH inside Python processes, which is
        # the only place the backend calls it from.
        working-directory: apps/backend
        run: |
          sudo apt-get remove -y ffmpeg >/dev/null 2>&1 || true
          sudo rm -f /usr/bin/ffmpeg /usr/bin/ffprobe
          . .venv/bin/activate
          python - <<'PY'
          import shutil, subprocess
          print("ffmpeg:", shutil.which("ffmpeg"), "ffprobe:", shutil.which("ffprobe"))
          assert "ffmpeg_bin" in (shutil.which("ffmpeg") or ""), "ffmpeg not from the wheel"
          subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-f", "lavfi", "-i", "testsrc=duration=1:size=64x64:rate=5", "-c:v", "libx264", "-y", "/tmp/wheel-smoke.mp4"], check=True)
          out = subprocess.run(["ffprobe", "-hide_banner", "-v", "error", "-show_entries", "stream=codec_name", "-of", "default=nw=1", "/tmp/wheel-smoke.mp4"], check=True, capture_output=True, text=True).stdout
          assert "codec_name=h264" in out, out
          PY

      - name: Django system checks
        # Same env as the test step below. Under the test settings DEBUG is on
        # while silk is not installed, which used to stop the checks from
        # importing at all (the silk guard in librephotos/urls.py fixes that).
        # --fail-level WARNING makes any system check warning fail the job.
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
        run: |
          . .venv/bin/activate
          python manage.py check --fail-level WARNING

      - name: Run tests
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
        run: |
          . .venv/bin/activate
          python manage.py test api.tests nextcloud

      - name: Type check (no new errors vs mypy-baseline.txt)
        # Runs even when tests failed, so type errors and test failures report
        # together; skipped only when the install itself failed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
        run: |
          . .venv/bin/activate
          BASE=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            BASE="--base-ref origin/$GITHUB_BASE_REF"
          fi
          python scripts/typecheck.py $BASE
