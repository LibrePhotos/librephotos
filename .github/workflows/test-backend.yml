name: test-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/test-backend.yml'

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The app targets 3.11 (pyproject `target-version`); lint-backend runs
          # a newer interpreter because ruff does not import the code, the tests
          # do.
          python-version: "3.11"
      # Installs the system libraries (libvips, exiftool, libmagic, ...) and the
      # Python requirements. Same script contributors use locally, so CI and a
      # local run cannot drift apart.
      - name: Install dependencies
        working-directory: apps/backend
        run: bash scripts/setup_test_env.sh
      - name: Run tests
        working-directory: apps/backend
        env:
          BASE_LOGS: /tmp/librephotos/logs
          BASE_DATA: /tmp/librephotos
          SECRET_KEY: test-secret-key
          DJANGO_SETTINGS_MODULE: librephotos.settings.test_sqlite
        run: python manage.py test api.tests
