name: lint-frontend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/frontend/**'
      # The frontend compiles the shared API client from source.
      - 'packages/api-client/**'
      - '.github/workflows/lint-frontend.yml'
  pull_request:
    paths:
      - 'apps/frontend/**'
      # The frontend compiles the shared API client from source.
      - 'packages/api-client/**'
      - '.github/workflows/lint-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000
      # Prettier over the web app and packages/api-client (one config for both).
      # Runs before the e2e install so e2e/node_modules does not exist yet.
      - name: format
        run: yarn run format:check
      # lint:error also lints e2e/, whose types come from its own dependencies.
      - name: install e2e dependencies
        run: yarn --cwd e2e install --frozen-lockfile --network-timeout 1000000
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: lint
        run: yarn run lint:error
      # tsc over the e2e suite, with the e2e dependencies installed above.
      - name: typecheck e2e
        run: yarn run typecheck:e2e
      - name: test
        run: yarn run test
      - name: build
        run: yarn run build
