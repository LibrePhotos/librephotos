name: lint-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/lint-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/lint-backend.yml'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # Must match required-version in apps/backend/pyproject.toml, otherwise
      # ruff refuses to run.
      - run: pip install ruff==0.15.22
      - name: ruff check
        run: ruff check apps/backend
      - name: ruff format --check
        run: ruff format --check apps/backend
