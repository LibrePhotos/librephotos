name: lint-backend

on:
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/lint-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/lint-backend.yml'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # The floor of requires-python (apps/backend/pyproject.toml), so the
          # scripts below keep running on the oldest Python the backend supports.
          python-version: "3.11"
      # Must match required-version in apps/backend/pyproject.toml, otherwise
      # ruff refuses to run.
      - run: pip install ruff==0.15.22
      - name: ruff check
        run: ruff check apps/backend
      - name: ruff format --check
        run: ruff format --check apps/backend
      # ruff check above already fails on findings the baseline does not list;
      # this also fails on stale entries (fixed findings still listed) and,
      # against the PR's base branch, on entries added with --update.
      - name: ruff baseline (only shrinks)
        working-directory: apps/backend
        run: |
          BASE=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            BASE="--base-ref origin/$GITHUB_BASE_REF"
          fi
          python scripts/ruff_baseline.py --check $BASE

  import-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # The floor of requires-python, like the jobs above.
          python-version: "3.11"
      # The pin lives in requirements.dev.txt, so CI and a local `lint-imports`
      # report the same. It reads the code statically: no backend dependencies.
      - run: pip install "$(grep '^import-linter==' apps/backend/requirements.dev.txt)"
      # The contracts are [tool.importlinter] in apps/backend/pyproject.toml.
      - name: lint-imports
        working-directory: apps/backend
        run: lint-imports --no-cache
      # lint-imports fails on an ignore_imports entry that matches no import;
      # this fails, against the PR's base branch, on an entry added to accept a
      # new violation.
      - name: Import contracts baseline (only shrinks)
        if: github.base_ref != ''
        working-directory: apps/backend
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          python scripts/import_contracts_baseline.py --base-ref "origin/$GITHUB_BASE_REF"

  dead-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # The floor of requires-python: vulture parses the code with this
          # interpreter, so syntax Python 3.11 rejects fails here too.
          python-version: "3.11"
      # The vulture pin lives in requirements.dev.txt, so CI and a local
      # `python scripts/check_dead_code.py` report the same findings.
      - run: pip install "$(grep '^vulture==' apps/backend/requirements.dev.txt)"
      - name: Unused functions, methods, classes and properties
        working-directory: apps/backend
        run: python scripts/check_dead_code.py
