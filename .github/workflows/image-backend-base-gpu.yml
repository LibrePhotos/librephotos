name: image-backend-base-gpu

on:
  release:
    types: [created]
  push:
    branches: [dev]
    paths:
      - 'deploy/docker/backend-gpu/base/**'
      - '.github/workflows/image-backend-base-gpu.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-26.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push (AMD64 only; GPU base is not useful on ARM)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/docker/backend-gpu/base
          file: deploy/docker/backend-gpu/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: reallibrephotos/librephotos-base-gpu:dev

  # A release does not rebuild the base: it pins the :dev the release was
  # tested on as :<release-tag>, which the GPU release build uses as BASE_TAG.
  # _build-image.yml does the same promotion before that build, since this job
  # runs in parallel with it; either copy is a no-op once the tag exists.
  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-26.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Promote :dev to the release tag
        env:
          BASE_IMAGE: reallibrephotos/librephotos-base-gpu
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if docker buildx imagetools inspect "${BASE_IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${BASE_IMAGE}:${RELEASE_TAG} already exists, leaving it alone"
          else
            docker buildx imagetools create -t "${BASE_IMAGE}:${RELEASE_TAG}" "${BASE_IMAGE}:dev"
          fi
