name: image-backend-base-gpu

on:
  release:
    types: [created]
  push:
    branches: [dev]
    paths:
      - 'deploy/docker/backend-gpu/base/**'
      - '.github/workflows/image-backend-base-gpu.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push (AMD64 only; GPU base is not useful on ARM)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: deploy/docker/backend-gpu/base
          file: deploy/docker/backend-gpu/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: reallibrephotos/librephotos-base-gpu:dev

  # A release does not rebuild the base: it pins the :dev the release was
  # tested on as :<release-tag>, which the GPU release build uses as BASE_TAG.
  # _build-image.yml does the same promotion before that build, since this job
  # runs in parallel with it; either copy is a no-op once the tag exists.
  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Promote :dev to the release tag
        env:
          BASE_IMAGE: reallibrephotos/librephotos-base-gpu
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if docker buildx imagetools inspect "${BASE_IMAGE}:${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${BASE_IMAGE}:${RELEASE_TAG} already exists, leaving it alone"
          else
            docker buildx imagetools create -t "${BASE_IMAGE}:${RELEASE_TAG}" "${BASE_IMAGE}:dev"
          fi
