name: typecheck-frontend

# `vite build` does not type-check. This runs plain `tsc --noEmit` over src/ and
# vite.config.ts (`yarn typecheck`): the frontend has zero errors and no baseline,
# so any error fails the job. The e2e suite is checked in lint-frontend.yml, after
# its dependencies are installed.

on:
  push:
    branches: [dev]
    paths:
      - 'apps/frontend/**'
      # The frontend compiles the shared API client from source.
      - 'packages/api-client/**'
      - '.github/workflows/typecheck-frontend.yml'
  pull_request:
    paths:
      - 'apps/frontend/**'
      # The frontend compiles the shared API client from source.
      - 'packages/api-client/**'
      - '.github/workflows/typecheck-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: install dependencies
        run: yarn install --frozen-lockfile --network-timeout 1000000
      - name: typecheck (zero errors)
        run: yarn run typecheck
