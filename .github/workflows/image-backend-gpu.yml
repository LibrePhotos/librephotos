name: image-backend-gpu

on:
  release:
    types: [created]
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - 'deploy/docker/backend-gpu/Dockerfile'
      - 'deploy/docker/backend-gpu/entrypoint.sh'
      - '.github/workflows/image-backend-gpu.yml'
      - '.github/workflows/_build-image.yml'

jobs:
  dev:
    if: github.event_name != 'release'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: reallibrephotos/librephotos-gpu
      dockerfile: deploy/docker/backend-gpu/Dockerfile
      amd64-only: true
      build-args: |
        IMAGE_TAG=dev
    secrets: inherit

  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: reallibrephotos/librephotos-gpu
      dockerfile: deploy/docker/backend-gpu/Dockerfile
      amd64-only: true
      release-tag: ${{ github.event.release.tag_name }}
      build-args: |
        IMAGE_TAG=${{ github.event.release.tag_name }}
    secrets: inherit
