name: image-backend-gpu

on:
  release:
    types: [created]
  push:
    branches: [dev]
    paths:
      - 'apps/backend/**'
      - 'deploy/docker/backend-gpu/Dockerfile'
      - 'deploy/docker/backend-gpu/entrypoint.sh'
      - '.github/workflows/image-backend-gpu.yml'
      - '.github/workflows/_build-image.yml'
  # Only what changes the GPU image's install: the image runs Python 3.10, which
  # no other build uses, and requirement bumps that need 3.11 broke it after
  # merge twice (#1867, #1884). The suite on 3.10 (test-backend.yml) covers
  # code changes.
  pull_request:
    paths:
      - 'apps/backend/requirements*.txt'
      - 'deploy/docker/backend-gpu/**'
      - '.github/workflows/image-backend-gpu.yml'

permissions:
  contents: read

jobs:
  # Builds the base and the image from the pull request's branch and pushes
  # neither. No Docker Hub login: fork pull requests get no secrets, and the
  # CUDA base and the published images are public.
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Plain docker build (no buildx container), so the second build finds the
      # base in the local image store instead of pulling :dev from Docker Hub,
      # and a change to the base Dockerfile is part of the test.
      - name: Build the base (not pushed)
        run: >-
          docker build
          --tag reallibrephotos/librephotos-base-gpu:pull-request
          --file deploy/docker/backend-gpu/base/Dockerfile
          deploy/docker/backend-gpu/base
      - name: Build the GPU image (not pushed)
        env:
          GIT_HASH: ${{ github.sha }}
        run: >-
          docker build
          --build-arg BASE_TAG=pull-request
          --build-arg IMAGE_TAG=pull-request
          --build-arg GIT_HASH="$GIT_HASH"
          --file deploy/docker/backend-gpu/Dockerfile
          .

  dev:
    if: github.event_name == 'push'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: reallibrephotos/librephotos-gpu
      dockerfile: deploy/docker/backend-gpu/Dockerfile
      base-image: reallibrephotos/librephotos-base-gpu
      amd64-only: true
      build-args: |
        IMAGE_TAG=dev
        GIT_HASH=${{ github.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

  release:
    if: github.event_name == 'release' && github.event.action == 'created'
    uses: ./.github/workflows/_build-image.yml
    with:
      image: reallibrephotos/librephotos-gpu
      dockerfile: deploy/docker/backend-gpu/Dockerfile
      base-image: reallibrephotos/librephotos-base-gpu
      amd64-only: true
      release-tag: ${{ github.event.release.tag_name }}
      build-args: |
        IMAGE_TAG=${{ github.event.release.tag_name }}
        GIT_HASH=${{ github.sha }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
