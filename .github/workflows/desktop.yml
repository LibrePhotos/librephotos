name: desktop

on:
  release:
    types: [created]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/api-client/**'
      - 'packages/local-db/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [dev]
    paths:
      - 'apps/desktop/**'
      - 'packages/api-client/**'
      - 'packages/local-db/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the installer of and attach it to; dispatch from that tag (leave empty for an artifact only)"
        required: false
      replace_asset:
        description: "Replace the installer and SHA256SUMS-desktop when the release already has them"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: desktop-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Test the notices generator
        run: node --test apps/desktop/scripts/notices/generate.test.mjs
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Build the UI
        working-directory: apps/desktop
        run: npx vite build
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-check
      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  installer:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPLACE_ASSET: ${{ inputs.replace_asset && 'true' || 'false' }}
      STABLE_SETUP: librephotos-desktop-windows-x64-setup.exe
      CHECKSUMS: SHA256SUMS-desktop
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Resolve the version
        id: version
        run: |
          VERSION=0.0.0
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A release installer is stamped with its tag, which must be X.Y.Z; got $TAG"
              exit 1
            fi
            VERSION="$TAG"
          fi
          {
            echo "VERSION=$VERSION"
            echo "VERSIONED_SETUP=librephotos-desktop-$VERSION-windows-x64-setup.exe"
          } >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - name: Check the release assets
        if: env.TAG != ''
        run: |
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          clash=""
          for name in "$VERSIONED_SETUP" "$STABLE_SETUP" "$CHECKSUMS"; do
            if grep -qxF "$name" <<<"$existing"; then
              clash="$clash $name"
            fi
          done
          if [ -n "$clash" ] && [ "$REPLACE_ASSET" != "true" ]; then
            echo "::error::Release $TAG already has$clash. Dispatch with replace_asset to replace them."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-release
      - name: Generate the third-party notices from the lockfiles
        run: node apps/desktop/scripts/notices/generate.mjs
      - name: Build the installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis --config "{\"version\":\"$VERSION\"}"
      - name: Collect the app and its notices for the Store package
        run: |
          mkdir -p dist-exe
          cp apps/desktop/src-tauri/target/release/librephotos-viewer.exe apps/desktop/public/THIRD-PARTY-NOTICES.txt dist-exe/
      - name: Keep the app for the Store package
        uses: actions/upload-artifact@v7
        with:
          name: librephotos-viewer-exe
          path: dist-exe/
          if-no-files-found: error
          retention-days: 1
      - name: Name the installer and its checksum
        run: |
          mkdir -p dist-desktop
          built=(apps/desktop/src-tauri/target/release/bundle/nsis/*_x64-setup.exe)
          if [ "${#built[@]}" -ne 1 ] || [ ! -f "${built[0]}" ]; then
            echo "::error::Expected one NSIS installer, found: ${built[*]}"
            exit 1
          fi
          cp "${built[0]}" "dist-desktop/$VERSIONED_SETUP"
          cp "${built[0]}" "dist-desktop/$STABLE_SETUP"
          cd dist-desktop
          sha256sum "$VERSIONED_SETUP" "$STABLE_SETUP" > "$CHECKSUMS"
          cat "$CHECKSUMS"
      - name: Smoke test the installer for the current user
        run: node apps/desktop/scripts/smoke-installer.mjs --scope user "dist-desktop/$STABLE_SETUP" apps/desktop/src-tauri/icons/128x128.png
      - name: Smoke test the installer for everyone
        run: node apps/desktop/scripts/smoke-installer.mjs --scope machine "dist-desktop/$STABLE_SETUP" apps/desktop/src-tauri/icons/128x128.png
      - uses: actions/upload-artifact@v7
        with:
          name: librephotos-desktop-windows-x64
          path: dist-desktop/
          if-no-files-found: error
          compression-level: 0
      - name: Attach to the release
        if: env.TAG != ''
        working-directory: dist-desktop
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --prerelease \
              --notes "Desktop app installer; see the desktop app docs."
          fi
          clobber=()
          if [ "$REPLACE_ASSET" = "true" ]; then
            clobber=(--clobber)
          fi
          gh release upload "$TAG" "$VERSIONED_SETUP" "$STABLE_SETUP" "$CHECKSUMS" "${clobber[@]}"
          echo "Attached $VERSIONED_SETUP, $STABLE_SETUP and $CHECKSUMS to $TAG." >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue about the failure
        if: failure() && env.TAG != ''
        run: |
          title="Desktop installer failed for $TAG"
          body="The [desktop run]($RUN_URL) for $TAG failed, so $TAG has no desktop installer yet.

          Fix the build, then re-run the failed job, or dispatch the desktop workflow from the tag with tag=$TAG (and replace_asset if some of the assets were attached)."
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL"
            exit 0
          fi
          gh issue create --title "$title" --body "$body"

  msix:
    needs: installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERSION: ${{ needs.installer.outputs.version }}
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
      MSSTORE_TENANT_ID: ${{ github.event_name != 'pull_request' && secrets.MSSTORE_TENANT_ID || '' }}
      MSSTORE_SELLER_ID: ${{ github.event_name != 'pull_request' && secrets.MSSTORE_SELLER_ID || '' }}
      MSSTORE_CLIENT_ID: ${{ github.event_name != 'pull_request' && secrets.MSSTORE_CLIENT_ID || '' }}
      MSSTORE_CLIENT_SECRET: ${{ github.event_name != 'pull_request' && secrets.MSSTORE_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test the packaging script
        run: node --test "apps/desktop/scripts/msix/*.test.mjs"
      - uses: actions/download-artifact@v7
        with:
          name: librephotos-viewer-exe
          path: dist-exe
      - name: Build the MSIX package
        run: |
          node apps/desktop/scripts/msix/pack.mjs --exe dist-exe/librephotos-viewer.exe --notices dist-exe/THIRD-PARTY-NOTICES.txt --version "$VERSION" --out dist-msix
          rm -rf dist-msix/layout dist-msix/priconfig.xml
          ls -l dist-msix
          unzip -l "dist-msix/librephotos-desktop-$VERSION-windows-x64.msix" | grep -q 'THIRD-PARTY-NOTICES.txt' || { echo "::error::THIRD-PARTY-NOTICES.txt is not in the MSIX package"; exit 1; }
      - name: Install, launch, import and remove the package
        shell: powershell
        run: |
          apps/desktop/scripts/msix/smoke-msix.ps1 `
            -Package "dist-msix/librephotos-desktop-$env:VERSION-windows-x64.msix" `
            -Exe dist-exe/librephotos-viewer.exe `
            -Picture deploy/e2e/photos/e2e_01.jpg `
            -SecondPicture deploy/e2e/photos/e2e_02.jpg `
            -OutDir msix-smoke
      - name: Windows App Certification Kit
        shell: powershell
        run: |
          apps/desktop/scripts/msix/wack.ps1 `
            -Package "msix-smoke/test-signed/librephotos-desktop-$env:VERSION-windows-x64.msix" `
            -Report msix-smoke/wack-report.xml
      - uses: actions/upload-artifact@v7
        with:
          name: librephotos-desktop-windows-x64-msix
          path: |
            dist-msix/*.msix
            dist-msix/*.msixupload
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msix-smoke-report
          path: |
            msix-smoke/*.png
            msix-smoke/wack-report.xml
          if-no-files-found: ignore
      - name: Check the Store submission settings
        id: store
        if: env.TAG != ''
        run: |
          missing=""
          for name in MSSTORE_PRODUCT_ID MSSTORE_TENANT_ID MSSTORE_SELLER_ID MSSTORE_CLIENT_ID MSSTORE_CLIENT_SECRET MSIX_IDENTITY_NAME MSIX_PUBLISHER MSIX_PUBLISHER_DISPLAY_NAME; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Store submission skipped, not configured:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "submit=false" >> "$GITHUB_OUTPUT"
          else
            echo "submit=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package for the Store with the reserved identity
        if: steps.store.outputs.submit == 'true'
        run: |
          node apps/desktop/scripts/msix/pack.mjs --exe dist-exe/librephotos-viewer.exe --notices dist-exe/THIRD-PARTY-NOTICES.txt --version "$VERSION" --out dist-store --require-identity
          rm -rf dist-store/layout dist-store/priconfig.xml
      - name: Set up the Microsoft Store Developer CLI
        if: steps.store.outputs.submit == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0
      - name: Submit to the Microsoft Store as a draft
        if: steps.store.outputs.submit == 'true'
        run: |
          msstore reconfigure --tenantId "$MSSTORE_TENANT_ID" --sellerId "$MSSTORE_SELLER_ID" --clientId "$MSSTORE_CLIENT_ID" --clientSecret "$MSSTORE_CLIENT_SECRET"
          msstore publish dist-store -i "dist-store/librephotos-desktop-$VERSION-windows-x64.msixupload" -id "$MSSTORE_PRODUCT_ID" --noCommit
          echo "Uploaded librephotos-desktop-$VERSION-windows-x64.msixupload to a draft Store submission; commit it in Partner Center." >> "$GITHUB_STEP_SUMMARY"

  macos:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      developer-id: ${{ steps.signing.outputs.developer-id }}
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      TARGET: universal-apple-darwin
      BUNDLE: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DEVELOPER_ID_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      APP_STORE_IDENTITY: ${{ vars.APPLE_APP_STORE_IDENTITY }}
      INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
    steps:
      - name: Resolve the version
        id: version
        run: |
          VERSION=0.0.0
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A release build is stamped with its tag, which must be X.Y.Z; got $TAG"
              exit 1
            fi
            VERSION="$TAG"
          fi
          {
            echo "VERSION=$VERSION"
            echo "DMG=librephotos-desktop-$VERSION-macos-universal.dmg"
            echo "PKG=librephotos-desktop-$VERSION-macos-universal-appstore.pkg"
          } >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Test the packaging script
        run: |
          node --test "apps/desktop/scripts/macos/*.test.mjs"
          node apps/desktop/scripts/macos/config.mjs check
      - name: Install
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: desktop-macos
      - name: Build the UI
        working-directory: apps/desktop
        run: npx vite build
      - name: Clippy on macOS
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test on macOS
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Check the signing settings
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_PROVISIONING_PROFILE: ${{ github.event_name != 'pull_request' && secrets.APPLE_PROVISIONING_PROFILE || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.APPLE_API_PRIVATE_KEY || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "Pull request builds are signed ad hoc and get no Apple secrets; Developer ID signing, notarization and the App Store package run on dev, manual runs and releases." | tee -a "$GITHUB_STEP_SUMMARY"
            {
              echo "developer-id=false"
              echo "app-store=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing() {
            local names=""
            for name in "$@"; do
              if [ -z "${!name}" ]; then
                case "$name" in
                  DEVELOPER_ID_IDENTITY) names="$names APPLE_SIGNING_IDENTITY" ;;
                  APP_STORE_IDENTITY) names="$names APPLE_APP_STORE_IDENTITY" ;;
                  INSTALLER_IDENTITY) names="$names APPLE_INSTALLER_IDENTITY" ;;
                  *) names="$names $name" ;;
                esac
              fi
            done
            echo "$names"
          }
          common="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY"
          dev=$(missing $common DEVELOPER_ID_IDENTITY)
          store=$(missing $common APP_STORE_IDENTITY INSTALLER_IDENTITY APPLE_PROVISIONING_PROFILE)
          if [ -n "$dev" ]; then
            echo "Developer ID signing and notarization skipped, not configured:$dev" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "developer-id=false" >> "$GITHUB_OUTPUT"
          else
            echo "developer-id=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$store" ]; then
            echo "App Store signing and upload skipped, not configured:$store" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "app-store=false" >> "$GITHUB_OUTPUT"
          else
            echo "app-store=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the third-party notices for both Mac targets
        run: |
          node apps/desktop/scripts/notices/generate.mjs --target aarch64-apple-darwin --target x86_64-apple-darwin
          grep -q 'decoded by ImageIO' apps/desktop/public/THIRD-PARTY-NOTICES.txt
      - name: Build the universal app
        working-directory: apps/desktop
        run: |
          node scripts/macos/config.mjs overlay --flavor developer-id --version "$VERSION" --build "$BUILD_NUMBER" --identity - --out "$RUNNER_TEMP/adhoc"
          node scripts/macos/config.mjs overlay --flavor app-store --version "$VERSION" --build "$BUILD_NUMBER" --identity - --team-id "" --out "$RUNNER_TEMP/adhoc"
          npx tauri build --target "$TARGET" --no-bundle --config "$RUNNER_TEMP/adhoc/tauri.developer-id.json"
      - name: Bundle the direct download, signed ad hoc
        working-directory: apps/desktop
        run: |
          npx tauri bundle --target "$TARGET" --bundles app,dmg --config "$RUNNER_TEMP/adhoc/tauri.developer-id.json"
          mkdir -p "$GITHUB_WORKSPACE/dist-macos"
          built=("$GITHUB_WORKSPACE/$BUNDLE"/dmg/*.dmg)
          if [ "${#built[@]}" -ne 1 ] || [ ! -f "${built[0]}" ]; then
            echo "::error::Expected one disk image, found: ${built[*]}"
            exit 1
          fi
          cp "${built[0]}" "$GITHUB_WORKSPACE/dist-macos/$DMG"
          rm "${built[0]}"
      - name: Bundle the App Store app, signed ad hoc, and package it
        working-directory: apps/desktop
        run: |
          npx tauri bundle --target "$TARGET" --bundles app --config "$RUNNER_TEMP/adhoc/tauri.app-store.json"
          scripts/macos/package-app-store.sh "$GITHUB_WORKSPACE/$BUNDLE/macos/LibrePhotos Viewer.app" "$GITHUB_WORKSPACE/dist-macos/$PKG"
      - uses: actions/upload-artifact@v7
        with:
          name: librephotos-desktop-macos-universal-adhoc
          path: dist-macos/
          if-no-files-found: error
          compression-level: 0
      - name: Import the signing certificates
        if: steps.signing.outputs.developer-id == 'true' || steps.signing.outputs.app-store == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/certificates.p12"
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          security find-identity -v
      - name: Sign, notarize and staple the direct download
        if: steps.signing.outputs.developer-id == 'true'
        working-directory: apps/desktop
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY.p8"
          node scripts/macos/config.mjs overlay --flavor developer-id --version "$VERSION" --build "$BUILD_NUMBER" --identity "$DEVELOPER_ID_IDENTITY" --out "$RUNNER_TEMP/signed"
          APPLE_SIGNING_IDENTITY="$DEVELOPER_ID_IDENTITY" npx tauri bundle --target "$TARGET" --bundles app,dmg --config "$RUNNER_TEMP/signed/tauri.developer-id.json"
          mkdir -p "$GITHUB_WORKSPACE/dist-macos-signed"
          mv "$GITHUB_WORKSPACE/$BUNDLE"/dmg/*.dmg "$GITHUB_WORKSPACE/dist-macos-signed/$DMG"
          cd "$GITHUB_WORKSPACE/dist-macos-signed"
          codesign --force --timestamp --sign "$DEVELOPER_ID_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          echo "Signed $DMG with $DEVELOPER_ID_IDENTITY, notarized and stapled it." >> "$GITHUB_STEP_SUMMARY"
      - name: Sign and package for the App Store
        if: steps.signing.outputs.app-store == 'true'
        working-directory: apps/desktop
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/viewer.provisionprofile"
          node scripts/macos/config.mjs overlay --flavor app-store --version "$VERSION" --build "$BUILD_NUMBER" --identity "$APP_STORE_IDENTITY" --team-id "$APPLE_TEAM_ID" --profile "$RUNNER_TEMP/viewer.provisionprofile" --out "$RUNNER_TEMP/signed"
          APPLE_SIGNING_IDENTITY="$APP_STORE_IDENTITY" npx tauri bundle --target "$TARGET" --bundles app --config "$RUNNER_TEMP/signed/tauri.app-store.json"
          mkdir -p "$GITHUB_WORKSPACE/dist-macos-signed"
          scripts/macos/package-app-store.sh "$GITHUB_WORKSPACE/$BUNDLE/macos/LibrePhotos Viewer.app" "$GITHUB_WORKSPACE/dist-macos-signed/$PKG" "$INSTALLER_IDENTITY"
          cd "$RUNNER_TEMP"
          xcrun altool --validate-app --type macos --file "$GITHUB_WORKSPACE/dist-macos-signed/$PKG" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
      - name: Upload to App Store Connect
        if: steps.signing.outputs.app-store == 'true' && env.TAG != ''
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        working-directory: ${{ runner.temp }}
        run: |
          xcrun altool --upload-app --type macos --file "$GITHUB_WORKSPACE/dist-macos-signed/$PKG" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          echo "Uploaded $PKG to App Store Connect; it shows up in TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.developer-id == 'true' || steps.signing.outputs.app-store == 'true'
        with:
          name: librephotos-desktop-macos-universal-signed
          path: dist-macos-signed/
          if-no-files-found: error
          compression-level: 0
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/viewer.provisionprofile"

  macos-smoke:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        mode: [dmg, app-store]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.macos.outputs.version }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: librephotos-desktop-macos-universal-adhoc
          path: dist-macos
      - name: Install, open pictures, check the data and remove the app
        run: |
          if [ "$MODE" = dmg ]; then
            artifact="dist-macos/librephotos-desktop-$VERSION-macos-universal.dmg"
          else
            artifact="dist-macos/librephotos-desktop-$VERSION-macos-universal-appstore.pkg"
          fi
          apps/desktop/scripts/macos/smoke.sh "$MODE" "$artifact" deploy/e2e/photos macos-smoke
      - name: Install and zap the Homebrew cask
        if: matrix.mode == 'dmg'
        run: apps/desktop/scripts/macos/cask-smoke.sh "dist-macos/librephotos-desktop-$VERSION-macos-universal.dmg" "$VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-smoke-${{ matrix.mode }}-${{ matrix.runner }}
          path: macos-smoke/*.png
          if-no-files-found: ignore

  macos-release:
    needs: [macos, macos-smoke]
    if: inputs.tag != '' || github.event_name == 'release'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERSION: ${{ needs.macos.outputs.version }}
      REPLACE_ASSET: ${{ inputs.replace_asset && 'true' || 'false' }}
      SIGNED: ${{ needs.macos.outputs.developer-id }}
      STABLE_DMG: librephotos-desktop-macos-universal.dmg
      CHECKSUMS: SHA256SUMS-desktop-macos
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.macos.outputs.developer-id == 'true' && 'librephotos-desktop-macos-universal-signed' || 'librephotos-desktop-macos-universal-adhoc' }}
          path: downloaded
      - name: Name the disk image, its checksum and the cask
        run: |
          versioned="librephotos-desktop-$VERSION-macos-universal.dmg"
          echo "VERSIONED_DMG=$versioned" >> "$GITHUB_ENV"
          mkdir -p dist-release "$RUNNER_TEMP/cask"
          cp "downloaded/$versioned" "dist-release/$versioned"
          cp "downloaded/$versioned" "dist-release/$STABLE_DMG"
          cd dist-release
          shasum -a 256 "$versioned" "$STABLE_DMG" > "$CHECKSUMS"
          cat "$CHECKSUMS"
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/macos/config.mjs" cask --version "$VERSION" --sha256 "$(shasum -a 256 "$versioned" | cut -d' ' -f1)" --out "$RUNNER_TEMP/cask/librephotos-viewer.rb"
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::$versioned is signed ad hoc, not with a Developer ID: Gatekeeper makes users allow it in System Settings, and the cask cannot go to homebrew/cask yet."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: librephotos-viewer-cask
          path: ${{ runner.temp }}/cask/librephotos-viewer.rb
          if-no-files-found: error
      - name: Attach to the release
        working-directory: dist-release
        run: |
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          clash=""
          for name in "$VERSIONED_DMG" "$STABLE_DMG" "$CHECKSUMS"; do
            if grep -qxF "$name" <<<"$existing"; then
              clash="$clash $name"
            fi
          done
          if [ -n "$clash" ] && [ "$REPLACE_ASSET" != "true" ]; then
            echo "::error::Release $TAG already has$clash. Dispatch with replace_asset to replace them."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --prerelease \
              --notes "Desktop app installers; see the desktop app docs." || gh release view "$TAG" >/dev/null
          fi
          clobber=()
          if [ "$REPLACE_ASSET" = "true" ]; then
            clobber=(--clobber)
          fi
          gh release upload "$TAG" "$VERSIONED_DMG" "$STABLE_DMG" "$CHECKSUMS" ${clobber[@]+"${clobber[@]}"}
          echo "Attached $VERSIONED_DMG, $STABLE_DMG and $CHECKSUMS to $TAG (Developer ID signed: $SIGNED)." >> "$GITHUB_STEP_SUMMARY"
