name: windows-wheels

# Builds the Windows wheels apps/backend/requirements.txt references by URL
# (packages with no win_amd64 wheel on PyPI) and attaches them to a release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. windows-wheels-2026.09.16"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build every wheel requirements.txt references by URL
        shell: python
        working-directory: apps/backend
        run: |
          import re, subprocess, sys
          specs = re.findall(r"^([A-Za-z0-9_.-]+) @ \S*/[A-Za-z0-9_.]+-([0-9][A-Za-z0-9_.!+]*)-[^/]*\.whl", open("requirements.txt").read(), re.M)
          if not specs:
              sys.exit("no wheel URLs in requirements.txt")
          subprocess.run([sys.executable, "-m", "pip", "install", "-U", "pip", "wheel"], check=True)
          for name, version in specs:
              subprocess.run([sys.executable, "-m", "pip", "wheel", "--no-deps", "--no-cache-dir", f"{name}=={version}", "-w", "wheels"], check=True)
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --prerelease \
            --notes "Windows (Python 3.11, win_amd64) wheels referenced by apps/backend/requirements.txt."
          gh release upload "$TAG" apps/backend/wheels/*.whl --clobber
